<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fila de Creche - Análise por Distrito</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .controls {
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        label {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        select {
            padding: 10px 15px;
            font-size: 16px;
            border: 2px solid #667eea;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 300px;
        }

        select:hover {
            border-color: #764ba2;
        }

        select:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin-top: 30px;
        }

        .info {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            color: #555;
            font-size: 14px;
        }

        .info strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Análise de Fila de Creche</h1>
        <p class="subtitle">Evolução do tempo de atendimento por distrito (2016-2024)</p>

        <div class="controls">
            <label for="districtSelect">Selecione o distrito:</label>
            <select id="districtSelect">
                <option value="">-- Escolha um distrito --</option>
            </select>
        </div>

        <div class="chart-container">
            <canvas id="filaChart"></canvas>
        </div>

        <div class="info" id="info" style="display: none;">
            <strong>Distrito:</strong> <span id="infoDistrict"></span><br>
            <strong>Menor tempo (dias):</strong> <span id="minValue"></span> em <span id="minYear"></span><br>
            <strong>Maior tempo (dias):</strong> <span id="maxValue"></span> em <span id="maxYear"></span>
        </div>
    </div>

    <script>
        let chart = null;
        let jsonData = null;

        // Carregar dados JSON
        async function loadData() {
            try {
                // Tentar fetch primeiro
                const response = await fetch('dados_consolidados.json');
                if (!response.ok) throw new Error('Fetch falhou');
                jsonData = await response.json();
                populateDropdown();
            } catch (error) {
                // Se fetch falhar, usar XMLHttpRequest como fallback
                const xhr = new XMLHttpRequest();
                xhr.open('GET', 'dados_consolidados.json', true);
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        jsonData = JSON.parse(xhr.responseText);
                        populateDropdown();
                    } else {
                        console.error('Erro ao carregar dados:', xhr.status);
                    }
                };
                xhr.onerror = function() {
                    console.error('Erro ao fazer requisição:', error);
                };
                xhr.send();
            }
        }

        // Preencher dropdown com distritos
        function populateDropdown() {
            const select = document.getElementById('districtSelect');
            const districts = Object.keys(jsonData).sort();
            
            districts.forEach(district => {
                const option = document.createElement('option');
                option.value = district;
                option.textContent = district;
                select.appendChild(option);
            });

            // Selecionar primeiro distrito por padrão
            if (districts.length > 0) {
                select.value = districts[0];
                updateChart(districts[0]);
            }
        }

        // Atualizar gráfico quando o dropdown muda
        document.getElementById('districtSelect').addEventListener('change', (e) => {
            const district = e.target.value;
            if (district) {
                updateChart(district);
            }
        });

        // Atualizar o gráfico
        function updateChart(district) {
            const data = jsonData[district];
            const years = Object.keys(data).sort();
            const values = years.map(year => data[year]);

            // Calcular min e max
            const minValue = Math.min(...values);
            const maxValue = Math.max(...values);
            const minYear = years[values.indexOf(minValue)];
            const maxYear = years[values.indexOf(maxValue)];

            // Atualizar informações
            document.getElementById('infoDistrict').textContent = district;
            document.getElementById('minValue').textContent = minValue;
            document.getElementById('minYear').textContent = minYear;
            document.getElementById('maxValue').textContent = maxValue;
            document.getElementById('maxYear').textContent = maxYear;
            document.getElementById('info').style.display = 'block';

            const ctx = document.getElementById('filaChart').getContext('2d');

            if (chart) {
                chart.destroy();
            }

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: years,
                    datasets: [{
                        label: `Fila - ${district}`,
                        data: values,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        pointRadius: 6,
                        pointBackgroundColor: '#667eea',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointHoverRadius: 8,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                font: { size: 14 },
                                padding: 20
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Dias de Atendimento'
                            },
                            ticks: {
                                font: { size: 12 }
                            }
                        },
                        x: {
                            ticks: {
                                font: { size: 12 }
                            }
                        }
                    }
                }
            });
        }

        // Carregar dados ao iniciar
        loadData();
    </script>
</body>
</html>
